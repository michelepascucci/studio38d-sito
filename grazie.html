<style>

.brand{display:inline-flex!important;align-items:center;gap:12px;font-family:"Inter Tight",sans-serif;font-weight:900;letter-spacing:-.045em;font-size:28px;line-height:1;text-decoration:none!important;color:#1A1A1A;white-space:nowrap}
/* === Tema Argilla === */
body{font-family:'Inter Tight',sans-serif}
img,.ph,.pimg{border-radius:20px}
.pimg,.ph{overflow:hidden}
.btn{border-radius:999px!important}
.card,.panel{border-radius:24px!important;overflow:hidden}
.tile{border-radius:18px!important}
input,select,textarea{border-radius:12px!important}
.opt{border-radius:14px!important}
.chip{border-radius:999px!important}

/* nav-mobile */
.site-head{position:relative;z-index:40;background:#F5F2ED}
.nav-toggle{display:none;width:46px;height:46px;border:1px solid #DCD3C4;border-radius:999px;background:#F5F2ED;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0}
.nav-toggle span{display:block;width:20px;height:2px;background:#1A1A1A;border-radius:2px;transition:transform .2s,opacity .2s}
.site-head.open .nav-toggle span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.site-head.open .nav-toggle span:nth-child(2){opacity:0}
.site-head.open .nav-toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mf-badge{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#F5F2ED!important;font-weight:600;font-size:14px;border:1px solid #3A3733;border-radius:999px;padding:6px 18px 6px 6px}
.mf-badge:hover{border-color:#D97757}
.mf-badge img{width:40px;height:40px;display:block;border-radius:50%!important}
@media (max-width:980px){
  .site-head nav{flex-wrap:nowrap!important;padding:12px 16px!important}
  .site-head .brand{font-size:22px!important;gap:10px!important}
  .site-head .brand img{width:32px!important;height:32px!important}
  .nav-toggle{display:inline-flex}
  .nav-links{display:none!important;position:absolute;top:100%;left:0;right:0;background:#F5F2ED;flex-direction:column;align-items:stretch!important;gap:0!important;padding:4px 16px 20px;border-bottom:1px solid #DCD3C4;box-shadow:0 18px 30px -20px rgba(0,0,0,.35)}
  .site-head.open .nav-links{display:flex!important}
  .nav-links a{padding:15px 2px!important;border-bottom:1px solid #DCD3C4!important;font-size:18px}
  .nav-links a[aria-current]{color:#A9512F}
  .nav-links a.btn{margin-top:16px;text-align:center;border-bottom:0!important;padding:15px 20px!important}
}
@media (max-width:640px){
  body section[style*="padding: 96px"],body section[style*="padding: 88px"],body section[style*="padding: 72px"]{padding-top:48px!important;padding-bottom:48px!important}

  .btn{max-width:100%;white-space:normal;text-align:center}
}
